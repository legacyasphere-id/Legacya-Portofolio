name: Deploy

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  validate:
    name: Validate source
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Check for required files
        run: |
          test -f index.html     || (echo "index.html missing"     && exit 1)
          test -f package.json   || (echo "package.json missing"   && exit 1)
          test -f vite.config.ts || (echo "vite.config.ts missing" && exit 1)
          echo "Source files found ✓"

      - name: Check image assets
        run: |
          for img in public/img-04.webp public/img-15.webp public/img-16.webp; do
            test -f "$img" || (echo "$img missing" && exit 1)
            echo "$img found ✓"
          done

      - name: Check HTML meta tags
        run: |
          grep -q "<!DOCTYPE html>"        index.html || (echo "Missing DOCTYPE"    && exit 1)
          grep -q '<meta charset='         index.html || (echo "Missing charset"    && exit 1)
          grep -q '<meta name="viewport"'  index.html || (echo "Missing viewport"   && exit 1)
          grep -q '<title>'                index.html || (echo "Missing title"      && exit 1)
          grep -q 'og:title'               index.html || (echo "Missing OG tags"   && exit 1)
          echo "All HTML checks passed ✓"

  build-and-deploy:
    name: Build & Deploy to GitHub Pages
    runs-on: ubuntu-latest
    needs: validate
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Build
        run: npm run build

      - name: Setup Pages
        uses: actions/configure-pages@v5

      - name: Upload dist artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: dist

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
