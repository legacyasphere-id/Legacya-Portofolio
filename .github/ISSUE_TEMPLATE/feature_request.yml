name: Feature Request
description: Suggest a new feature or improvement
title: "[feat]: "
labels: ["enhancement"]
body:
  - type: markdown
    attributes:
      value: |
        Got an idea that would make Legacya Sphere better? Share it here.

  - type: textarea
    id: problem
    attributes:
      label: What problem does this solve?
      description: Describe the pain point or gap this feature addresses.
      placeholder: Visitors can't easily see which projects are case studies vs. side projects.
    validations:
      required: true

  - type: textarea
    id: solution
    attributes:
      label: Proposed solution
      description: Describe what you'd like to see implemented.
      placeholder: Add a filter tag system to the Work section — users can toggle between "Client Work", "Personal", and "AI".
    validations:
      required: true

  - type: textarea
    id: alternatives
    attributes:
      label: Alternatives considered
      description: Any other approaches you thought about?
    validations:
      required: false

  - type: dropdown
    id: category
    attributes:
      label: Feature category
      options:
        - Visual / Design
        - Animation / Interaction
        - Performance
        - Accessibility
        - SEO
        - Content / Copy
        - New Section
        - Developer Experience
        - Other
    validations:
      required: true

  - type: dropdown
    id: priority
    attributes:
      label: How important is this to you?
      options:
        - Nice to have
        - Would significantly improve the experience
        - Critical — site feels incomplete without it
    validations:
      required: true
